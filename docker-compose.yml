# For Dokploy. Set the env vars below in Dokploy, and NOTES_UID/NOTES_GID
# to the owner of the vault on the host.
services:
  notes:
    build: .
    restart: unless-stopped
    user: '${NOTES_UID:-1000}:${NOTES_GID:-1000}'
    volumes:
      - ${NOTES_VAULT_PATH:?path to the vault on the host}:/vault
      - notes-data:/data
    environment:
      - NOTES_API_KEY
      - SUPABASE_URL
      - SUPABASE_API_KEY
      - SUPABASE_ANON_KEY
      - SUPABASE_ADMIN_UID
      - GITHUB_APP_ID
      - GITHUB_APP_PRIVATE_KEY
      - NOTES_SITE_REMOTE=${NOTES_SITE_REMOTE:-https://github.com/dtinth/dt.in.th}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-notes}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-notes@dt.in.th}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-notes}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-notes@dt.in.th}
    expose:
      - '21024'

volumes:
  notes-data:
